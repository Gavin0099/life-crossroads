name: Project CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-app:
    needs: ios-simulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Simulator shard to succeed
        env:
          LIFE_UI_RESULT: ${{ needs.ios-simulator.result }}
        run: test "$LIFE_UI_RESULT" = success

  ios-simulator:
    needs: swift-engine
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise a complete iPhone Simulator life
        run: |
          mkdir -p artifacts/ios
          python3 scripts/ios-test-shards.py "${{ matrix.shard }}" 3 > artifacts/ios/selected-tests.txt
          LIFE_UI_CASES=()
          while IFS= read -r LIFE_UI_CASE; do
            LIFE_UI_CASES+=("$LIFE_UI_CASE")
          done < artifacts/ios/selected-tests.txt
          if ! bash scripts/ios-check.sh "${LIFE_UI_CASES[@]}" > artifacts/ios/build-and-test.log 2>&1; then
            tail -100 artifacts/ios/build-and-test.log
            exit 1
          fi
          LIFE_UI_SUMMARIES=(artifacts/ios/*.runtime-summary.json)
          test "${#LIFE_UI_SUMMARIES[@]}" -eq 1
          python3 scripts/ios-test-shards.py "${{ matrix.shard }}" 3 --summary "${LIFE_UI_SUMMARIES[0]}"
          python3 - <<'PY'
          from pathlib import Path
          for line in Path("artifacts/ios/build-and-test.log").read_text().splitlines():
              if ("Test Case " in line and ("passed (" in line or "failed (" in line)) or "Executed " in line or "Deleted test Simulator:" in line:
                  print(line)
          PY
      - name: Preserve Simulator test result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lc02-ios-evidence-${{ matrix.shard }}
          path: artifacts/ios/
          if-no-files-found: warn

  swift-engine:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Verify pinned data offline
        run: |
          python3 scripts/build-data.py --check
          python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Test pure Swift rules and source integrity
        run: swift test -c release
      - name: Verify actual world motion helper boundaries
        run: |
          mkdir -p artifacts/lc01
          swiftc LifeCrossroads/App/LifeWorldMotion.swift artifacts/evidence/life-loop/visual-motion/verify-motion.swift -o artifacts/lc01/motion-check
          artifacts/lc01/motion-check > artifacts/lc01/world-motion.json
      - name: Build release executable
        run: swift build -c release
      - name: Execute four-country comparison and life skeletons
        run: |
          mkdir -p artifacts/lc01
          swift run -c release life-demo --json > artifacts/lc01/demo.json
      - name: Verify three distinct stories and deterministic replay
        run: swift run -c release life-demo --story-samples > artifacts/lc01/story-samples.json
      - name: Replay a full branch while preserving its original life
        run: swift run -c release life-demo --branch-sample > artifacts/lc01/branch-sample.json
      - name: Verify eight-country environments and comparable choice routes
        run: |
          swift run -c release life-demo --environment-samples > artifacts/lc01/environment-samples.json
          python3 scripts/render-environment-report.py artifacts/lc01/environment-samples.json artifacts/lc01/environment-report.md
      - name: Preserve creative opportunity witnesses across eight countries
        run: swift run -c release life-demo --opportunity-samples > artifacts/lc01/opportunity-samples.json
      - name: Measure all backgrounds and policies with a bounded Seed sample
        run: |
          swift run -c release life-demo --batch-report --seed-count 4 > artifacts/lc01/batch-report.json
          python3 scripts/render-batch-report.py artifacts/lc01/batch-report.json artifacts/lc01/batch-report.md
      - name: Preserve engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lc01-engine-evidence
          path: artifacts/lc01/
          if-no-files-found: warn

  basic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local governance tooling
        run: bash scripts/governance-setup.sh
      - name: Run required repository checks
        run: bash scripts/governance-check.sh --profile basic
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-check-evidence
          path: artifacts/governance/
          if-no-files-found: warn

  governance-audit:
    needs: basic-checks
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install governance tooling
        run: bash scripts/governance-setup.sh
      - name: Run advisory runtime audit
        run: bash scripts/governance-check.sh --profile full
      - name: Preserve audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit-evidence
          path: artifacts/governance/
          if-no-files-found: warn
